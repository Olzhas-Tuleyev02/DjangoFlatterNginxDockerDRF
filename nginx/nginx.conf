server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /vol/web/static/;
    }

    location /media/ {
        alias /vol/web/media/;
    }

    location / {
        # Используем полное имя контейнера для обхода проблем с DNS
        proxy_pass http://production_web_shop-main-backend-1:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}