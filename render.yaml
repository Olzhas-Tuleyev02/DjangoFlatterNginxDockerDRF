services:
  - name: backend
    type: web
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  - name: celery-worker
    type: worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A core worker -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: backend
          envVarKey: SECRET_KEY

  - name: celery-beat
    type: worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: backend
          envVarKey: SECRET_KEY

databases:
  - name: db
    databaseName: web_shop_db
    user: web_shop_user
    plan: free